    and ±0.2 °C for SHT31, so a small accuracy loss). Plan to extend to 2 m with shielded twisted pair, lower the I2C clock
    (10-50 kHz) and use stronger pull-ups, or put a P82B715 or similar I2C extender at the far end. Probots notes 3-5 m works
    with STP and a low clock. A sealed stainless 'soil' probe responds slowly to RH, so a mesh or sintered vented cap is better
    for air.
