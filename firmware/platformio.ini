; Seri-tool firmware. Two environments:
;   native  - pure logic (lib/core) compiled for this PC and unit-tested with Unity
;   esp32   - the real target, ESP32-DevKitC (WROOM-32E)
[platformio]
default_envs = native

[env]
test_framework = unity

[env:native]
platform = native
build_flags = -std=gnu++17 -Wall -Wextra -Werror
test_build_src = no

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -Wall
lib_deps =
  knolleary/PubSubClient@2.8
  olikraus/U8g2@2.36.5
build_src_filter = +<*> +<hal_esp32/>
board_build.partitions = min_spiffs.csv

; Same firmware for the Wokwi simulator: clock runs x60 (the virtual DS3231 is set to speed 60),
; so one simulated minute covers an hour of shed time.
[env:esp32-sim]
extends = env:esp32
build_flags = ${env:esp32.build_flags} -DSERI_SIM=1
