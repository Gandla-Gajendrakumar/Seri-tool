; Seri-tool firmware. Two environments:
;   native  - pure logic (lib/core) compiled for this PC and unit-tested with Unity
;   esp32   - the real target, ESP32-DevKitC (WROOM-32E)
[platformio]
default_envs = native

[env]
test_framework = unity

[env:native]
platform = native
build_flags = -std=gnu++17 -Wall -Wextra -Werror
test_build_src = no

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -Wall
