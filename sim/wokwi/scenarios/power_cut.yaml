name: "Power cut: switch to battery, alert after 2 min debounce, low battery, power back"
version: 1
author: "seri-tool"

steps:
  - wait-serial: "READY"
  # register the owner phone by SMS, exactly as a farmer would: "10 <PIN>"
  - set-control: {part-id: modem, control: deliver, value: 1}
  - wait-serial: "sent,9876543210"
  - set-control: {part-id: carrier, control: mains, value: 0}
  - set-control: {part-id: carrier, control: batteryMv, value: 3900}
  - wait-serial: "MainsFail,Start"
  - wait-serial: "sent,9876543210"
  - set-control: {part-id: carrier, control: batteryMv, value: 3300}
  - wait-serial: "LowBattery,Start"
  - wait-serial: "sent,9876543210"
  - set-control: {part-id: carrier, control: mains, value: 1}
  - set-control: {part-id: carrier, control: batteryMv, value: 3800}
  - wait-serial: "MainsFail,Clear"
  - wait-serial: "sent,9876543210"
