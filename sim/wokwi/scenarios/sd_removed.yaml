name: "SD card removed: fault alert, monitoring and alerts continue, card back is detected"
version: 1
author: "seri-tool"

steps:
  - wait-serial: "READY"
  # register the owner phone by SMS, exactly as a farmer would: "10 <PIN>"
  - set-control: {part-id: modem, control: deliver, value: 1}
  - wait-serial: "sent,9876543210"
  - set-control: {part-id: carrier, control: sd_present, value: 0}
  - wait-serial: "SdFault,Start"
  - wait-serial: "sent,9876543210"
  - set-control: {part-id: sht, control: temperature, value: 31}
  - wait-serial: "TempHigh,Start"
  - wait-serial: "sent,9876543210"
  - set-control: {part-id: carrier, control: sd_present, value: 1}
  - wait-serial: "SdFault,Clear"
